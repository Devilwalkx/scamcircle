appId: app.devilwalkx.scamcircle
name: After the process was ended the unfinished message is still there
---
- launchApp
- tapOn: "Check a message"
- assertVisible: "Unfinished draft zebra quokka"
- takeScreenshot: 06-draft-restored
- scrollUntilVisible:
    element: "Clear everything here"
    direction: DOWN
    timeout: 45000
    speed: 70
- tapOn: "Clear everything here"
- assertNotVisible: "Unfinished draft zebra quokka"

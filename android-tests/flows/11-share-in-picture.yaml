appId: app.devilwalkx.scamcircle
name: A picture shared from another app is shown as not analysed, with crop offered
---
- assertVisible: "Picture received"
- assertVisible: "This picture was not analysed"
- assertVisible: "Crop it to share with someone"
- takeScreenshot: 11a-picture-received
- tapOn: "Crop it to share with someone"
- assertVisible: "Crop a picture to share"
- assertVisible: "This picture was not analysed"
- tapOn: "More from the top"
- assertVisible: "Cut off the top: 5%"
- takeScreenshot: 11b-crop
